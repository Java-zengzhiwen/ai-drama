[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-drama-skill-runtime"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "openai>=1.0",
]

[project.scripts]
ai-drama = "ai_drama_runtime.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["ai_drama_runtime*"]
