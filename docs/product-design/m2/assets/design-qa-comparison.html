<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M2 Design QA Comparison</title>
  <style>
    body {
      margin: 0;
      background: #f6f8fb;
      color: #1f2937;
      font: 14px/1.45 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { padding: 16px; display: grid; gap: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .panel { background: #fff; border: 1px solid #d9dee8; border-radius: 6px; overflow: hidden; }
    .title { padding: 10px 12px; border-bottom: 1px solid #d9dee8; font-weight: 650; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <section class="panel">
        <div class="title">Source visual target: Asset Detail Review Page</div>
        <img src="selected-direction-asset-detail-review-page.png" alt="Selected direction">
      </section>
      <section class="panel">
        <div class="title">Rendered prototype: detail state</div>
        <img src="prototype-detail-screenshot.png" alt="Rendered prototype">
      </section>
    </div>
  </div>
</body>
</html>
