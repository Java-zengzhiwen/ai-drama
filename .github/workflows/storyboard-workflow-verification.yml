name: storyboard-workflow-verification

on:
  push:
    branches:
      - main
      - "feat/**"
      - "test/**"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "test/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migration verify
        run: python3 migration/tools/verify_migration.py
      - name: Py compile
        run: |
          python3 -m py_compile \
            migration/tools/verify_migration.py \
            ai_drama_runtime/*.py \
            skills/ai-drama-script-adaptation-skill/v0.6.1-rc2.4/validators/*.py \
            skills/ai-drama-script-adaptation-skill/v0.6.1-rc2.4/runtime-validators/*.py \
            skills/ai-drama-storyboard-design-skill/v0.1.0/validators/*.py
      - name: Full pytest
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTEST_ADDOPTS='-p no:cacheprovider' python3 -m pytest -q
      - name: Storyboard verification
        run: |
          python3 tools/verify_storyboard_workflow.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-verification-report
          path: /tmp/ai-drama-storyboard-verification-report/
